<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flip Coin</title>
<!-- Jar: ?resetJar restores defaults. Cmd+Shift+R (Ctrl+Shift+R on Windows) also resets jar + cache-bust reload. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5.0.0/400.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5.0.0/500.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.0/400.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.0/600.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #F2EEEA;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .flip-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .action-row {
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }

  .tips-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Coin ── (50% shorter travel, ~15% quicker) */
  .coin-container {
    position: relative;
    width: 32px;
    height: 130px;
    flex-shrink: 0;
    overflow: visible;
    transform: scale(0.8);
    transform-origin: bottom center;
  }

  .coin-pool {
    position: absolute;
    top: 0;
    left: -12px;
    width: 56px;
    height: 130px;
    pointer-events: none;
  }

  .coin-spawn {
    position: absolute;
    top: 0;
    left: 12px;
    width: 32px;
    height: 130px;
  }

  .coin-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 32px;
    height: 130px;
    overflow: hidden;
  }

  .coin {
    width: 32px;
    height: 32px;
    position: absolute;
    left: 0;
    top: 130px;
    transform-style: preserve-3d;
  }

  .coin-face {
    position: absolute;
    width: 32px;
    height: 32px;
    overflow: hidden;
    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .coin-face svg {
    display: block;
    width: 64px;
    height: 64px;
    transform: scale(0.5);
    transform-origin: 0 0;
    shape-rendering: geometricPrecision;
  }
  .coin-face.back {
    transform: rotateY(180deg);
  }

  /* Diagonal shine streak */
  .shine {
    position: absolute;
    inset: -6px;
    background: linear-gradient(
      -52deg,
      transparent 28%,
      rgba(255, 252, 220, 0)   41%,
      rgba(255, 255, 255, 0.92) 50%,
      rgba(255, 252, 220, 0)   59%,
      transparent 72%
    );
    opacity: 0;
    transform: translateX(-130%);
    pointer-events: none;
    z-index: 2;
  }

  .coin.flipping .shine {
    animation: shineSwipe 0.44s ease-in-out forwards;
  }

  @keyframes shineSwipe {
    0%   { opacity: 0;   transform: translateX(-130%); }
    36%  { opacity: 0;   transform: translateX(-130%); }
    45%  { opacity: 1;   transform: translateX(-5%);   }
    54%  { opacity: 0;   transform: translateX(130%);  }
    100% { opacity: 0;   transform: translateX(130%);  }
  }

  /* 4-point star bling at coin edge */
  .coin-star {
    position: absolute;
    top: 3px;
    right: -4px;
    width: 10px;
    height: 10px;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    background: white;
    clip-path: polygon(50% 0%, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0% 50%, 44% 44%);
    filter: drop-shadow(0 0 4px rgba(255, 200, 60, 0.95));
  }

  .coin-star.flinging {
    animation: starBling 0.9s ease-in-out forwards;
  }

  @keyframes starBling {
    0%   { opacity: 0; transform: scale(0)   rotate(-15deg); }
    40%  { opacity: 0; transform: scale(0)   rotate(-15deg); }
    48%  { opacity: 1; transform: scale(1.4) rotate(10deg);  }
    57%  { opacity: 0; transform: scale(0.2) rotate(25deg);  }
    100% { opacity: 0; transform: scale(0)   rotate(25deg);  }
  }

  .coin.flipping { animation: coinFlip 0.38s ease-in-out forwards; }
  .coin.flipping.v2 { animation: coinFlipV2 0.365s ease-in-out forwards; }
  .coin.flipping.v3 { animation: coinFlipV3 0.4s ease-in-out forwards; }
  .coin.flipping.v4 { animation: coinFlipV4 0.375s ease-in-out forwards; }
  .coin.flipping.v5 { animation: coinFlipV5 0.39s ease-in-out forwards; }
  .coin.flipping.v6 { animation: coinFlipV6 0.36s ease-in-out forwards; }
  .coin.flipping.v7 { animation: coinFlipV7 0.41s ease-in-out forwards; }
  .coin.flipping.v8 { animation: coinFlipV8 0.37s ease-in-out forwards; }

  @keyframes coinFlip {
    0%   { top: 130px; transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
    50%  { top: 0;     transform: rotateY(360deg); animation-timing-function: cubic-bezier(0.64, 0, 0.78, 0); }
    100% { top: 130px; transform: rotateY(720deg); }
  }
  @keyframes coinFlipV2 {
    0%   { top: 130px; transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.25, 0.55, 0.38, 1); }
    48%  { top: 3px;   transform: rotateY(345deg); animation-timing-function: cubic-bezier(0.62, 0, 0.8, 0); }
    100% { top: 130px; transform: rotateY(705deg); }
  }
  @keyframes coinFlipV3 {
    0%   { top: 130px; transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.2, 0.65, 0.34, 1); }
    52%  { top: -3px;  transform: rotateY(375deg); animation-timing-function: cubic-bezier(0.66, 0, 0.76, 0); }
    100% { top: 130px; transform: rotateY(735deg); }
  }
  @keyframes coinFlipV4 {
    0%   { top: 130px; transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.23, 0.6, 0.35, 1); }
    50%  { top: -2px;  transform: rotateY(370deg); animation-timing-function: cubic-bezier(0.63, 0, 0.79, 0); }
    100% { top: 130px; transform: rotateY(730deg); }
  }
  @keyframes coinFlipV5 {
    0%   { top: 130px; transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.21, 0.62, 0.37, 1); }
    50%  { top: 2px;   transform: rotateY(350deg); animation-timing-function: cubic-bezier(0.65, 0, 0.77, 0); }
    100% { top: 130px; transform: rotateY(710deg); }
  }
  @keyframes coinFlipV6 {
    0%   { top: 130px; transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.24, 0.58, 0.36, 1); }
    49%  { top: 1px;   transform: rotateY(355deg); animation-timing-function: cubic-bezier(0.61, 0, 0.81, 0); }
    100% { top: 130px; transform: rotateY(715deg); }
  }
  @keyframes coinFlipV7 {
    0%   { top: 130px; transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.2, 0.64, 0.34, 1); }
    51%  { top: -1px;  transform: rotateY(365deg); animation-timing-function: cubic-bezier(0.66, 0, 0.76, 0); }
    100% { top: 130px; transform: rotateY(725deg); }
  }
  @keyframes coinFlipV8 {
    0%   { top: 130px; transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.22, 0.59, 0.37, 1); }
    50%  { top: 0;     transform: rotateY(360deg); animation-timing-function: cubic-bezier(0.64, 0, 0.78, 0); }
    100% { top: 130px; transform: rotateY(720deg); }
  }

  /* ── Button ── */
  .flip-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px;
    background: transparent;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
    user-select: none;
    white-space: nowrap;
    overflow: visible;
  }

  .flip-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px;
    border: 1px solid rgba(80, 70, 59, 0.12);
    background: transparent;
    z-index: -1;
    transition: border-color 0.2s, background 0.2s;
  }

  .flip-btn:hover::before {
    border-color: rgba(80, 70, 59, 0.16);
    background: #FFF;
  }

  .flip-btn::after {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 3px;
    background: #FAFAF9;
    z-index: -1;
    transition: background 0.2s;
  }

  .flip-btn:hover::after {
    background: #FFF;
  }

  .flip-btn:active::after {
    background: #F8F8F7;
  }

  /* Radial pulsating circle on tip – soft, blurred, from center */
  .flip-btn .pulse-ring {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    background: radial-gradient(circle at center, rgba(249, 115, 22, 0.5) 0%, rgba(249, 115, 22, 0.2) 25%, rgba(249, 115, 22, 0.05) 50%, transparent 70%);
    filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    z-index: -2;
    transform-origin: center;
  }

  .flip-btn.pulse .pulse-ring {
    animation: iconPulseSoft 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes iconPulseSoft {
    0%   { opacity: 0.9; transform: scale(0.3); }
    70%  { opacity: 0.4; transform: scale(1.4); }
    100% { opacity: 0; transform: scale(1.9); }
  }


  /* Already tipped state */
  .flip-btn.tipped::after {
    background: radial-gradient(120.26% 191.49% at 50% 146.17%, rgba(255, 147, 97, 0.20) 0%, rgba(250, 250, 250, 0.20) 100%), #FAFAF9;
  }

  .flip-btn.tipped::before {
    border-color: #FFE5DD;
  }

  .flip-btn.tipped:hover::after {
    background: radial-gradient(120.26% 191.49% at 50% 146.17%, rgba(255, 147, 97, 0.18) 0%, rgba(252, 252, 251, 0.25) 100%), #FFF;
  }

  .flip-btn.tipped:hover::before {
    border-color: rgba(255, 229, 221, 0.9);
    background: transparent;
  }

  .flip-btn.tipped .counter {
    color: #F97316;
  }

  .flip-btn.tipped .btn-icon path {
    stroke: #F97316;
  }

  /* ── Vote buttons (same style as tip, green/red) ── */
  .vote-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px;
    background: transparent;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    user-select: none;
  }

  .vote-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 4px;
    border: 1px solid rgba(80, 70, 59, 0.12);
    background: transparent;
    z-index: -1;
    transition: border-color 0.2s, background 0.2s;
  }

  .vote-btn:hover::before {
    border-color: rgba(80, 70, 59, 0.16);
    background: #FFF;
  }

  .vote-btn::after {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 3px;
    background: #FAFAF9;
    z-index: -1;
    transition: background 0.2s;
  }

  .vote-btn:hover::after {
    background: #FFF;
  }

  .vote-btn:active::after {
    background: #F8F8F7;
  }

  .vote-btn .vote-icon {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    aspect-ratio: 1/1;
    display: block;
  }

  .vote-btn .vote-icon {
    transition: transform 0.2s ease-out;
  }

  .vote-btn .vote-icon path {
    stroke: #50463B;
    transition: stroke 0.15s;
  }

  .vote-btn .vote-pulse {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    background: radial-gradient(circle at center, transparent 0%, transparent 30%);
    filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    z-index: -2;
    transform-origin: center;
  }

  .vote-btn.pulse .vote-pulse {
    animation: iconPulseSoft 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  .vote-btn.upvote.pulse .vote-pulse {
    background: radial-gradient(circle at center, rgba(0, 152, 96, 0.45) 0%, rgba(0, 152, 96, 0.18) 25%, rgba(0, 152, 96, 0.04) 50%, transparent 70%);
  }

  .vote-btn.downvote.pulse .vote-pulse {
    background: radial-gradient(circle at center, rgba(208, 63, 69, 0.45) 0%, rgba(208, 63, 69, 0.18) 25%, rgba(208, 63, 69, 0.04) 50%, transparent 70%);
  }

  .vote-btn.voted .vote-icon {
    animation: voteIconPop 0.35s ease-out;
  }

  @keyframes voteIconPop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  /* Upvote voted state – Grass green */
  .vote-btn.upvote.voted::after {
    background: radial-gradient(120.26% 191.49% at 50% 146.17%, rgba(85, 206, 161, 0.20) 0%, rgba(250, 250, 250, 0.20) 100%), #FFF;
  }

  .vote-btn.upvote.voted::before {
    border-color: #C3FFEA;
  }

  .vote-btn.upvote.voted:hover::after {
    background: radial-gradient(120.26% 191.49% at 50% 146.17%, rgba(85, 206, 161, 0.16) 0%, rgba(252, 252, 251, 0.25) 100%), #FFF;
  }

  .vote-btn.upvote.voted:hover::before {
    border-color: rgba(195, 255, 234, 0.9);
    background: transparent;
  }

  .vote-btn.upvote.voted .vote-icon path {
    stroke: #009860;
  }

  .vote-btn.upvote.voted .vote-counter {
    color: #009860;
  }

  /* Downvote voted state – Devil red */
  .vote-btn.downvote.voted::after {
    background: radial-gradient(120.26% 191.49% at 50% 146.17%, rgba(241, 134, 132, 0.20) 0%, rgba(250, 250, 250, 0.20) 100%), #FFF;
  }

  .vote-btn.downvote.voted::before {
    border-color: #FFE1DD;
  }

  .vote-btn.downvote.voted:hover::after {
    background: radial-gradient(120.26% 191.49% at 50% 146.17%, rgba(241, 134, 132, 0.16) 0%, rgba(252, 252, 251, 0.25) 100%), #FFF;
  }

  .vote-btn.downvote.voted:hover::before {
    border-color: rgba(255, 225, 221, 0.9);
    background: transparent;
  }

  .vote-btn.downvote.voted .vote-icon path {
    stroke: #D03F45;
  }

  .btn-icon {
    flex-shrink: 0;
    display: block;
    transition: transform 0.2s ease-out;
  }

  .flip-btn.icon-pop .btn-icon {
    animation: voteIconPop 0.2s ease-out;
  }

  /* ── Animated counter (odometer-style digit roll) ── */
  .counter {
    display: inline-flex;
    align-items: center;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    line-height: 120%;
    color: #50463B;
    font-variant-numeric: tabular-nums;
    transition: color 0.15s;
  }


  .digit-slot {
    display: inline-block;
    width: 0.65em;
    height: 1.2em;
    overflow: hidden;
    line-height: 1.2;
    text-align: center;
    vertical-align: middle;
    position: relative;
  }

  .digit-slot.decimal {
    width: 0.3em;
  }

  .digit-roll {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    transition: transform 0.22s cubic-bezier(0.34, 1.2, 0.64, 1);
    will-change: transform;
  }

  .digit-cell {
    height: 1.2em;
    min-height: 1.2em;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  .digit-slot.decimal .digit-roll {
    transition: none;
  }

  .counter.tick .digit-slot.decimal,
  .counter.tick .digit-slot:nth-last-child(1),
  .counter.tick .digit-slot:nth-last-child(2) {
    animation: decimalTick 0.2s ease-out;
  }

  .vote-counter {
    display: inline-flex;
    align-items: center;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    line-height: 120%;
    color: #50463B;
    font-variant-numeric: tabular-nums;
    transition: color 0.15s;
  }

  @keyframes decimalTick {
    0%   { transform: scale(1); opacity: 1; }
    45%  { transform: scale(1.06); opacity: 0.9; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ── On-hold minimodal ── */
  .tip-minimodal-outer {
    --countdown-sweep: 0;
    position: fixed;
    z-index: 1000;
    box-sizing: border-box;
    width: 208px;
    max-width: calc(100vw - 24px);
    padding: 1px;
    border-radius: 8px;
    background: #EEE7DF;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.2s, visibility 0.2s, transform 0.2s;
  }

  .tip-minimodal-outer.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /**
   * While the outer is not shown, keep the charging/countdown chrome hidden.
   * Otherwise dismiss of the “broke” tooltip removes .tip-minimodal--no-balance before the
   * fade finishes, and the main UI flashes inside the fading shell (looks like the previous modal).
   */
  .tip-minimodal-outer:not(.visible) .tip-minimodal-main,
  .tip-minimodal-outer:not(.visible) .tip-minimodal-progress-wrap,
  .tip-minimodal-outer:not(.visible) .tip-minimodal-actions {
    display: none !important;
  }

  /** Click-only no-balance tooltip: width hugs copy (other states keep fixed 208px outer) */
  .tip-minimodal-outer.tip-minimodal-outer--text-only {
    width: max-content;
    max-width: calc(100vw - 24px);
  }

  /** Wallet mode: neutral-600 base + orange sweep from 12 o'clock, smooth --countdown-sweep 0→1 */
  .tip-minimodal-outer.tip-minimodal-outer--wallet {
    background: conic-gradient(
      from 0deg,
      #ff9361 0deg,
      #c43100 calc(var(--countdown-sweep, 0) * 360deg),
      #525252 calc(var(--countdown-sweep, 0) * 360deg)
    );
  }

  /** Wraps top row + progress so outer modal gap still separates actions correctly */
  .tip-minimodal-main {
    display: flex;
    flex-direction: column;
    align-self: stretch;
    width: 100%;
    box-sizing: border-box;
    gap: 10px;
    min-width: 0;
  }

  .tip-minimodal {
    --Brand-500: #FF6622;
    display: flex;
    width: 100%;
    box-sizing: border-box;
    padding: 8px 8px 11px;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    gap: 10px;
    border-radius: 7px;
    border: none;
    background: #FAFAFA;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .tip-minimodal.tip-minimodal--wallet {
    background: #FFF8F5;
    box-shadow: 0 10px 15px -3px rgba(196, 49, 0, 0.12), 0 4px 6px -4px rgba(0, 0, 0, 0.06);
  }

  .tip-minimodal-top {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    align-self: stretch;
  }

  .tip-minimodal-col--left {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    gap: 6px;
    flex: 1 0 0;
    align-self: stretch;
    min-width: 0;
  }

  .tip-minimodal-countdown-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
    color: #8B7E6F;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.18s ease, max-height 0.22s ease;
  }

  .tip-minimodal--phase-charging .tip-minimodal-countdown-line,
  .tip-minimodal--countdown-phase .tip-minimodal-countdown-line {
    opacity: 1;
    max-height: 3.25em;
  }

  .tip-minimodal--countdown-ticking .tip-minimodal-countdown-line {
    gap: 0.35em;
  }

  .tip-minimodal-countdown-label {
    flex-shrink: 0;
  }

  .tip-minimodal-countdown-suffix {
    display: inline-block;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transform: translateX(-3px);
    transition: opacity 0.38s ease, transform 0.38s ease, visibility 0s linear 0.38s;
  }

  .tip-minimodal--countdown-ticking .tip-minimodal-countdown-suffix {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
    transition: opacity 0.38s ease, transform 0.38s ease, visibility 0s linear 0s;
  }

  .tip-minimodal-usd-row {
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 1.2em;
  }

  .tip-minimodal-usd-prefix {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    line-height: 12px;
    letter-spacing: -0.24px;
    text-transform: uppercase;
    color: #342C24;
    flex-shrink: 0;
  }

  .tip-minimodal-usd-row .counter {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    line-height: 12px;
    letter-spacing: -0.24px;
    text-transform: uppercase;
    color: #342C24;
    font-variant-numeric: tabular-nums;
  }

  .tip-minimodal-col--right {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-end;
    gap: 6px;
    flex: 1 0 0;
    align-self: stretch;
    min-width: 0;
  }

  .tip-minimodal-from {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 500;
    line-height: 120%;
    color: #50463B;
  }

  .tip-minimodal-from > svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }

  .tip-minimodal-token-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 2px;
    align-self: stretch;
    line-height: 120%;
  }

  .tip-minimodal-token-row .counter {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: #50463B;
    font-variant-numeric: tabular-nums;
  }

  .tip-minimodal-token-suffix {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: #50463B;
    flex-shrink: 0;
  }

  .tip-minimodal-progress-wrap {
    display: flex;
    flex-direction: column;
    align-self: stretch;
    gap: 6px;
  }

  .tip-minimodal-progress-slot {
    position: relative;
    align-self: stretch;
    min-height: 8px;
    perspective: 220px;
    perspective-origin: 50% 50%;
  }

  .tip-minimodal-progress {
    display: flex;
    height: 8px;
    justify-content: space-between;
    align-items: flex-start;
    align-self: stretch;
    border-radius: 8px;
    background: #DCD2C8;
    backdrop-filter: blur(1px);
    overflow: hidden;
  }

  .tip-minimodal-progress--jar {
    position: relative;
    z-index: 2;
    transition: opacity 0.14s ease-out, transform 0.14s ease-out;
    transform-origin: center center;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .tip-minimodal-progress--wallet {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    z-index: 1;
    opacity: 0.26;
    transition: opacity 0.14s ease-out, transform var(--bar-flip-dur, 200ms) cubic-bezier(0.22, 1, 0.36, 1),
      z-index 0s linear var(--bar-flip-dur, 200ms);
    transform-origin: center center;
    transform: rotateX(0deg);
    transform-style: preserve-3d;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .tip-minimodal-progress-slot.wallet-front .tip-minimodal-progress--jar {
    z-index: 1;
    opacity: 0.22;
    transform: rotateX(-88deg) scale(0.985);
  }

  .tip-minimodal-progress-slot.wallet-front .tip-minimodal-progress--wallet {
    z-index: 3;
    opacity: 1;
    transform: rotateX(0deg) scale(1);
    transition: opacity 0.12s ease-out, transform var(--bar-flip-dur, 200ms) cubic-bezier(0.22, 1, 0.36, 1),
      z-index 0s linear 0s;
  }

  .tip-minimodal-progress-slot.flip-pulse.wallet-front .tip-minimodal-progress--wallet {
    animation: walletBarLand 0.32s cubic-bezier(0.22, 1.1, 0.36, 1) both;
  }

  @keyframes walletBarLand {
    0% {
      transform: rotateX(10deg) scale(0.97);
      filter: saturate(1.18) brightness(1.04);
    }
    100% {
      transform: rotateX(0deg) scale(1);
      filter: none;
    }
  }

  .tip-minimodal-progress-inner {
    display: flex;
    padding: 0 4px 0 1px;
    align-items: center;
    gap: 4px;
    flex: 1 0 0;
    align-self: stretch;
    min-width: 0;
  }

  .tip-minimodal-progress-fill {
    height: 100%;
    width: 0%;
    max-width: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, #55cea1, #00b281);
    transform-origin: left center;
    transition: width 0.05s linear;
  }

  .tip-minimodal-progress-fill--jar {
    background: linear-gradient(90deg, #55cea1, #00b281);
  }

  .tip-minimodal-progress-fill--wallet {
    border-radius: 8px;
    background: linear-gradient(90deg, #FFD05B 25%, var(--Brand-500, #F62) 100%);
    transition: width 0.05s linear;
  }

  /** Wallet: gradient only on the fill; neutral track (#DCD2C8) shows as the bar shrinks */
  .tip-minimodal-progress--wallet .tip-minimodal-progress-fill--wallet {
    border-radius: 8px;
    background: linear-gradient(90deg, #FFD05B 25%, var(--Brand-500, #F62) 100%);
  }

  .tip-minimodal-cap-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    align-self: stretch;
    gap: 8px;
    min-height: 0;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.2;
    color: #7a6e63;
    transition: opacity 0.2s ease, max-height 0.22s ease;
  }

  .tip-minimodal-cap-row.visible {
    max-height: 2.5em;
    opacity: 1;
  }

  .tip-minimodal-cap-row-left {
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }

  .tip-minimodal-cap-row-right {
    flex-shrink: 0;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: #ca8a04;
  }

  .tip-minimodal-bottom-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    align-self: stretch;
    gap: 8px;
    min-height: 0;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.2;
    color: #50463b;
    transition: opacity 0.22s ease, max-height 0.24s ease;
  }

  .tip-minimodal-bottom-info.visible {
    max-height: 2.75em;
    opacity: 1;
  }

  .tip-minimodal-bottom-info.fade-in {
    animation: bottomInfoFadeIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes bottomInfoFadeIn {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .tip-minimodal-bottom-side {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }

  .tip-minimodal-bottom-side svg {
    width: 11px;
    height: 11px;
    flex-shrink: 0;
  }

  .tip-minimodal-bottom-wallet-val {
    font-variant-numeric: tabular-nums;
    color: inherit;
  }

  /** No-balance: tooltip-only (main UI hidden via .tip-minimodal--no-balance) */
  .tip-minimodal--no-balance {
    width: max-content;
    max-width: calc(100vw - 24px);
    padding: 6px 10px;
    align-items: center;
    gap: 0;
  }

  .tip-minimodal--no-balance .tip-minimodal-main {
    display: none !important;
  }

  .tip-minimodal--no-balance .tip-minimodal-send,
  .tip-minimodal--no-balance .tip-minimodal-cancel {
    display: none !important;
  }

  .tip-minimodal-no-balance-tooltip {
    display: none;
    margin: 0;
    padding: 0;
    width: auto;
    max-width: 15rem;
    box-sizing: border-box;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.35;
    color: #50463B;
    text-align: center;
    white-space: normal;
  }

  .tip-minimodal--no-balance .tip-minimodal-no-balance-tooltip {
    display: block;
  }

  .tip-minimodal-no-balance-tooltip[hidden] {
    display: none !important;
  }

  .tip-minimodal-from > .tip-minimodal-from-icon-jar {
    display: block;
  }

  .tip-minimodal-from > .tip-minimodal-from-icon-wallet {
    display: none;
  }

  .tip-minimodal--wallet .tip-minimodal-from > .tip-minimodal-from-icon-jar {
    display: none;
  }

  .tip-minimodal--wallet .tip-minimodal-from > .tip-minimodal-from-icon-wallet {
    display: block;
  }

  /** Wallet mode: orange ~$ USD row (PRD #F97316); token row = wallet remaining */
  .tip-minimodal-usd-row--wallet-hot .tip-minimodal-usd-prefix,
  .tip-minimodal-usd-row--wallet-hot .tip-minimodal-usd-counter {
    font-weight: 600;
    line-height: 12px;
    letter-spacing: -0.24px;
    text-transform: uppercase;
    color: #f97316;
    -webkit-text-fill-color: #f97316;
  }

  .tip-minimodal-usd-row--wallet-hot .tip-minimodal-usd-counter .digit-cell {
    color: #f97316;
    -webkit-text-fill-color: #f97316;
  }

  .tip-minimodal-usd-row--wallet-hot .tip-minimodal-usd-counter .digit-slot.decimal,
  .tip-minimodal-usd-row--wallet-hot .tip-minimodal-usd-counter .digit-slot.decimal .digit-cell {
    color: #f97316;
    -webkit-text-fill-color: #f97316;
  }

  .tip-minimodal-from.from-wallet {
    color: #50463b;
  }

  .tip-minimodal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    align-self: stretch;
  }

  .tip-minimodal-send {
    display: flex;
    padding: 2px;
    align-items: center;
    gap: 2px;
    border-radius: 4px;
    border: none;
    background: transparent;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    line-height: 120%;
    color: #50463B;
    cursor: pointer;
  }

  .tip-minimodal-send:hover {
    background: rgba(80, 70, 59, 0.06);
  }

  .tip-minimodal-send:disabled {
    opacity: 0.42;
    cursor: not-allowed;
  }

  .tip-minimodal-send:disabled:hover {
    background: transparent;
  }

  .tip-minimodal-cancel {
    display: flex;
    padding: 2px;
    align-items: center;
    gap: 2px;
    border-radius: 4px;
    border: none;
    background: transparent;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    line-height: 120%;
    color: #B50023;
    cursor: pointer;
  }

  .tip-minimodal-cancel:hover {
    background: rgba(181, 0, 35, 0.06);
  }
</style>
